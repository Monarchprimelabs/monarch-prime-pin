# Fast checks on every pull request and on main: the same ones
# docs/RELEASE_CHECKLIST.md asks for before opening a PR. No secrets, no
# builds; EAS builds stay manual (.eas/workflows/release-ios.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (UTC, New York, Tokyo)
        run: npm test
      - name: Heat map tests
        run: node scripts/test-heat.js
      - name: i18n key parity
        run: node scripts/check-i18n.js
